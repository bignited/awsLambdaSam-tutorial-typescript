AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  WanderLamb

  SAM Template for WanderLamb

Resources:
  WanderLambFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: wanderLamb/
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      Events:
        WanderLamb:
          Type: Api
          Properties:
            Path: /travel
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints: 
        - app.ts
